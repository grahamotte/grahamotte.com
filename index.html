<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>grahamotte.com</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(120, 113, 108, 0.14), transparent 28rem),
        #050505;
      color: #d8d3c8;
    }

    svg {
      width: min(34vw, 11rem);
      height: auto;
      filter: drop-shadow(0 0 2rem rgba(216, 211, 200, 0.2));
      animation: turn 18s linear infinite reverse;
    }

    @keyframes turn {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      svg {
        animation: none;
      }
    }
  </style>
</head>
